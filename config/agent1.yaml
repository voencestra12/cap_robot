/agent1/robot_agent_node:
  ros__parameters:
    agent_id: agent1
    robot_ip: 192.168.1.218
    enable_perception: true
    object_match_distance_mm: 60.0   # 같은 종류의 이전 위치와 매칭할 최대 거리(mm)
    object_memory_retention_sec: 3.0 # 미검출 후 ID를 유지할 시간(초)
    perception_settle_sec: 0.5       # 이동 종료 후 이 시간이 지난 프레임만 계획/재확인에 사용(초)
    pick_verify_radius_mm: 40.0      # 실행 직전 계획 위치 근처에 같은 재료가 있어야 파지(mm)
    pick_verify_timeout_sec: 3.0     # 재확인용 새 프레임 대기 한도(초)
    basket_exclusion_radius_mm: 100.0  # 적층 시 바구니 중심 XY 반경 안 재료는 후보 제외(mm), 실측 필요

    # 현재 두 Agent 구성 예시. 실제 담당 구역에 맞게 수정하세요.
    agent_specs: ["agent1:A", "agent2:B"]
    agent_base_frames: ["agent1:robot_1_base", "agent2:robot_2_base"]

    robot_base_frame: robot_1_base
    workspace_frame: workspace_0

    tf_lookup_timeout_sec: 1.0
    tf_cache_period_sec: 0.2
    tf_cache_max_age_sec: 60.0
    tf_buffer_cache_sec: 60.0
    tf_lookup_delay_sec: 0.5
    tf_debug_log_period_sec: 2.0

    # 안전을 위해 기본값은 dry_run입니다. 실제 구동 확인 후 false로 바꾸세요.
    dry_run: false
    enable_sdk_safety_box: true
    sdk_x_min: 50.0
    sdk_x_max: 750.0
    sdk_y_min: -600.0
    sdk_y_max: 600.0
    sdk_z_min: 20.0
    sdk_z_max: 700.0

    color_topic: /agent1/camera/color/image_raw
    depth_topic: /agent1/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /agent1/camera/color/camera_info
    # 기본 물체 + 샌드위치 재료(bread, lettuce, ham) 세그멘테이션 모델
    yolo_model_paths: [models/yolo11m-seg.pt, models/yolo-bread-lettuce-ham.pt]
    # 모델 간 박스 IoU가 이 값 이상이면 뒤쪽(재료 전용) 모델 우선
    yolo_cross_model_iou_threshold: 0.6

    llm_model: gemma4:e4b
    ollama_url: http://localhost:11434/api/generate
    llm_think: true                   # true: 추론 켜기, false: 추론 끄기
    guidebook_prompt_file: agent_guidebook_policy.txt
    cooperative_review_prompt_file: agent_cooperative_review.txt
    guidebook_policy_enabled: true
    guidebook_policy_poll_sec: 1.0
    guidebook_policy_retry_sec: 5.0
    guidebook_topic: /mission/guidebook

    # [MERGED] Guidebook/Agent 검토/action barrier 통신
    task_claim_topic: /mission/task_claim
    task_status_topic: /mission/task_status
    # 파란 바구니 스티커 HSV는 config/yolo_extra_perception.yaml에서 공통 설정
    extra_perception_topic: /perception/yolo_extra
    extra_perception_max_age_sec: 5.0
    cooperative_review_timeout_sec: 60.0
    step_sync_timeout_sec: 30.0
    step_start_delay_sec: 0.25

    # A+B 공용 구역 토큰 / 기하 게이트 (zone_token_manager 노드 1개를 함께 실행)
    zone_token_enabled: true
    zone_token_request_topic: /zone_token/request
    zone_token_state_topic: /zone_token/state
    zone_token_acquire_timeout_sec: 60.0
    zone_token_lease_sec: 45.0          # zone_token_manager의 lease_sec과 일치시킬 것
    shared_zone_x_min: 150.0            # workspace_0 절대좌표(mm)
    shared_zone_x_max: 450.0
    shared_zone_y_min: -50.0
    shared_zone_y_max: 500.0
    shared_zone_margin_mm: 0.0

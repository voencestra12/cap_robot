# 역할: 로봇별 통합 설정. 인터페이스: 각 노드 config_file.
# [변경] 수동 선택 실기 프로필. 검증 플래그는 false이며 시작 시 모터 비활성.
agent_id: agent2
robot_ip: 192.168.1.198
base_frame: robot_2_base
dry_run: false
commissioning:
  calibration_verified: false
  workspace_verified: false
  cooperative_verified: false
  orientation_verified: false
safety:
  min_xyz:
  - 0.1
  - -0.4
  - 0.1
  max_xyz:
  - 0.65
  - 0.4
  - 0.65
  max_speed: 0.08
  max_accel: 0.2
  tcp_radius: 0.02
  initial_position:
  - 0.3
  - 0.0
  - 0.35
  initial_rpy:
  - 3.141592653589793
  - 0.0
  - 0.0
  permit_timeout: 1.5
  command_timeout: 20.0
  state_timeout: 0.5
  command_max_age: 1.0
  max_step: 0.3
  gripper_min: 0.0
  gripper_max: 850.0
  max_rotation_step: 0.15
  max_angular_speed: 0.1
  max_angular_accel: 0.2
llm:
  url: http://localhost:11434/api/generate
  model: gemma4:e4b
  timeout: 45.0
planning:
  max_replans: 2
  observation_max_age: 2.0
  search_max_views: 4
  search_min:
  - 0.15
  - -0.3
  - 0.15
  search_max:
  - 0.6
  - 0.3
  - 0.6
  search_views:
  - - 0.3
    - -0.1
    - 0.4
  - - 0.3
    - 0.1
    - 0.4
  command_timeout: 25.0
perception:
  backend: yolo
  color_topic: /agent2/camera/color/image_raw
  depth_topic: /agent2/camera/aligned_depth_to_color/image_raw
  camera_info_topic: /agent2/camera/color/camera_info
  model_paths:
  - models/yolo11m-seg.pt
  - models/yolo-bread.pt
  label_aliases: {}
  confidence: 0.45
  max_age: 1.0
  sync_slop: 0.08
  mock_objects:
  - id: agent2_bread_1
    label: bread
    position:
    - 0.32
    - 0.05
    - 0.2
    confidence: 1.0
  - id: agent2_handle_1
    label: handle
    position:
    - 0.3
    - 0.0
    - 0.3
    confidence: 1.0
  - id: agent2_lettuce_1
    label: lettuce
    position:
    - 0.4
    - 0.1
    - 0.2
    confidence: 1.0
  detect_red_handles: true
cooperative:
  enabled: false
  world_frame: workspace_0
  max_translation_step: 0.015
  max_speed: 0.02
  relative_tolerance: 0.006
  pose_tolerance: 0.015
  start_delay: 1.0
  prepare_timeout: 0.6
  max_start_skew: 0.05
  plan_timeout: 60.0
  command_timeout: 25.0
  observation_max_age: 2.0
  gate_timeout: 0.5
  permit_timeout: 1.5

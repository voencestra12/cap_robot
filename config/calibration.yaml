/aruco_calib:
  ros__parameters:
    image_topic: /fixed_camera/camera/color/image_raw
    camera_info_topic: /fixed_camera/camera/color/camera_info
    camera_frame: fixed_camera/camera_color_optical_frame
    marker_size_m: 0.05
    target_debug_log_period_sec: 2.0
    show_window: true

    # 각 고정 변환: 5초 이내 관측 중 30개 이상, 1초 이상, 80% 이상 일치해야 확정.
    # 작업대는 기존처럼 한 프레임에 작업대 마커 4개 이상이 필요하다.
    calibration_min_samples: 30
    calibration_min_duration_sec: 1.0
    calibration_max_age_sec: 5.0
    calibration_translation_tolerance_m: 0.01
    calibration_rotation_tolerance_deg: 3.0
    calibration_max_reprojection_error_px: 2.0

    # [x, y, z, qx, qy, qz, qw]
    # offset_1: [-0.195949, 0.004359, 0.026819, 0.020803, 0.005481, 0.696245, 0.717482]
    # offset_1: [-0.185429, 0.003176, 0.018006, -0.011176, 0.002573, 0.698863, 0.715164]
    offset_1: [-0.199929, 0.023176, 0.020006, -0.011176, 0.002573, 0.698863, 0.715164]
    offset_2: [-0.198899, -0.001916, 0.024214, 0.014971, 0.013757, 0.706619, 0.707302]

    # workspace_0 원점 = 마커 0 중심. 아래 배치로 보이는 마커들의 코너를 함께 solvePnP한다.
    workspace_marker_ids: [0, 2, 4, 11, 13, 15]
    # marker ID 순서대로 [x, y, z]를 이어 붙인 값, 단위 mm
    workspace_marker_offsets_mm: [
      0.0, 0.0, 0.0,
      300.0, 0.0, 0.0,
      600.0, 0.0, 0.0,
      600.0, 350.0, 0.0,
      300.0, 350.0, 0.0,
      0.0, 350.0, 0.0
    ]

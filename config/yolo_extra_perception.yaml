/yolo_extra_perception:
  ros__parameters:
    # [MERGED] 연구실 고정 RealSense의 ROS 스트림을 공유합니다.
    color_topic: /fixed_camera/camera/color/image_raw
    depth_topic: /fixed_camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /fixed_camera/camera/color/camera_info
    workspace_frame: workspace_0
    state_topic: /perception/yolo_extra
    handle_0_topic: /basket/handle_0_pose
    handle_1_topic: /basket/handle_1_pose
    agent_base_frames: ["agent1:robot_1_base", "agent2:robot_2_base"]

    minimum_area_px: 50.0
    depth_window_radius_px: 2
    smoothing_window: 5
    maximum_frame_age_sec: 0.5
    tf_lookup_timeout_sec: 0.3
    show_window: false

    sdk_x_min: 50.0
    sdk_x_max: 750.0
    sdk_y_min: -600.0
    sdk_y_max: 600.0
    sdk_z_min: 20.0
    sdk_z_max: 700.0
